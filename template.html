<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar Concorsi</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<meta name="theme-color" content="#0F5C4E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --carta:#EEF1F4; --foglio:#FFFFFF; --inchiostro:#14202E; --grigio:#5B6776;
    --filo:#D5DBE2; --verde:#0F5C4E; --verde-chiaro:#DCEBE7; --urgente:#B42318; --urgente-chiaro:#FBE4E2;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --carta:#0F161D; --foglio:#18222C; --inchiostro:#E6ECF1; --grigio:#9AA7B4;
    --filo:#2A3642; --verde:#5CC2A8; --verde-chiaro:#173A33; --urgente:#FF8A80; --urgente-chiaro:#3A1D1C; } }
  :root[data-theme="dark"]{
    --carta:#0F161D; --foglio:#18222C; --inchiostro:#E6ECF1; --grigio:#9AA7B4;
    --filo:#2A3642; --verde:#5CC2A8; --verde-chiaro:#173A33; --urgente:#FF8A80; --urgente-chiaro:#3A1D1C; }
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Public Sans",system-ui,-apple-system,sans-serif;background:var(--carta);color:var(--inchiostro);
       font-size:15px;line-height:1.45;max-width:560px;margin:0 auto;padding-bottom:48px;-webkit-text-size-adjust:100%}
  header{padding:22px 18px 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
  h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
  .agg{font-size:12.5px;color:var(--grigio);margin-top:4px}
  .btn-agg{text-decoration:none;display:inline-flex;align-items:center;background:var(--verde);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;min-height:44px}
  .btn-agg:disabled{opacity:.55;cursor:wait}
  .btn-agg:focus-visible,.chip:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #7FB8AC;outline-offset:2px}

  .stato{margin:0 12px 10px;padding:10px 14px;border-radius:10px;font-size:13.5px;background:var(--verde-chiaro);color:var(--verde);display:none}
  .stato.on{display:block}
  .stato.errore{background:var(--urgente-chiaro);color:var(--urgente)}
  .barra{height:4px;background:rgba(15,92,78,.18);border-radius:4px;margin-top:8px;overflow:hidden}
  .barra i{display:block;height:100%;background:var(--verde);width:0;transition:width .4s}

  details.filtri{background:var(--foglio);margin:0 12px;border-radius:14px;border:1px solid var(--filo)}
  details.filtri summary{list-style:none;padding:13px 16px;display:flex;justify-content:space-between;font-size:14px;cursor:pointer}
  details.filtri summary::-webkit-details-marker{display:none}
  details.filtri summary span:last-child{color:var(--grigio);font-size:13px}
  .filtri-corpo{padding:0 16px 16px}
  .riga{margin-top:14px}.riga:first-child{margin-top:0}
  .riga-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;color:var(--grigio);margin-bottom:6px}
  .riga-top strong{color:var(--inchiostro);font-size:15px}
  input[type=range]{width:100%;accent-color:var(--verde);height:32px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:1.5px solid var(--filo);background:var(--foglio);color:var(--grigio);border-radius:999px;padding:8px 13px;font-family:inherit;font-weight:500;font-size:13.5px;cursor:pointer;min-height:38px}
  .chip[aria-pressed=true]{background:var(--verde-chiaro);border-color:var(--verde);color:var(--verde)}

  .conteggio{padding:18px 18px 8px;font-size:13.5px;color:var(--grigio)}
  .conteggio strong{color:var(--inchiostro)}
  ol{list-style:none;padding:0 12px;display:flex;flex-direction:column;gap:10px}
  .bando{background:var(--foglio);border-radius:14px;border:1px solid var(--filo);display:grid;grid-template-columns:74px 1fr;overflow:hidden}
  .scad{background:var(--verde-chiaro);color:var(--verde);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;text-align:center}
  .scad b{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.03em}
  .scad span{font-size:11.5px;margin-top:3px}
  .bando.urgente .scad{background:var(--urgente-chiaro);color:var(--urgente)}
  .bando.ignota .scad{background:var(--carta);color:var(--grigio)}
  .corpo{padding:12px 14px;min-width:0}
  .ente{font-size:13px;color:var(--grigio);display:flex;justify-content:space-between;gap:8px}
  .affinita{color:var(--verde);font-weight:600;white-space:nowrap}
  .titolo{font-weight:600;margin:3px 0 8px;font-size:15px;overflow-wrap:anywhere}
  .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px}
  .meta span{background:var(--carta);border-radius:6px;padding:2px 7px}
  .link{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:10px;font-size:14px;font-weight:600}
  .link a{color:var(--verde);text-decoration:none;padding:4px 0}
  .vuoto{margin:10px 12px;padding:28px 22px;text-align:center;color:var(--grigio);background:var(--foglio);border-radius:14px;border:1px dashed var(--filo)}
  .nota{margin:18px 18px 0;font-size:12px;color:var(--grigio)}

  .come{margin:0 12px 10px;padding:10px 14px;border-radius:10px;font-size:13px;background:var(--foglio);border:1px solid var(--filo);color:var(--grigio)}
  .come b{color:var(--inchiostro)}
  
  .cerca{width:100%;padding:10px 12px;border:1.5px solid var(--filo);border-radius:10px;font:inherit;font-size:15px;background:var(--foglio);color:var(--inchiostro)}
  .gu{font-size:12px;color:var(--grigio);margin-top:6px}
</style>
</head>
<body>
<header>
  <div>
    <h1>Radar<br>Concorsi</h1>
    <div class="agg" id="aggiornato">Gazzetta Ufficiale · 4ª Serie<br>…</div>
  </div>
  <a class="btn-agg" id="aggiorna" target="_blank" rel="noopener">Aggiorna</a>
</header>

<details class="filtri" id="pannello">
  <summary><span>Filtri</span><span id="riassunto"></span></summary>
  <div class="filtri-corpo">
    <div class="riga">
      <input class="cerca" type="search" id="q" placeholder="Cerca ente, profilo, comune" aria-label="Cerca">
    </div>
    <div class="riga">
      <div class="riga-top"><span>Distanza massima</span><strong id="kmLabel">60 km</strong></div>
      <input type="range" id="km" min="10" max="310" step="10" value="60" aria-label="Distanza massima da Bologna">
    </div>
    <div class="riga">
      <div class="riga-top"><span>Inquadramento</span></div>
      <div class="chips" data-gruppo="inq">
        <button class="chip" aria-pressed="true" data-v="Funzionari">Funzionari / EQ</button>
        <button class="chip" aria-pressed="true" data-v="Dirigenza">Dirigenza</button>
        <button class="chip" aria-pressed="false" data-v="Istruttori">Istruttori</button>
      </div>
    </div>
    <div class="riga">
      <div class="riga-top"><span>Area</span></div>
      <div class="chips" data-gruppo="area">
        <button class="chip" aria-pressed="true" data-v="Amministrativa">Amministrativa</button>
        <button class="chip" aria-pressed="true" data-v="Economico-finanziaria">Economico-finanziaria</button>
        <button class="chip" aria-pressed="true" data-v="Informatica/Dati">Informatica / Dati</button>
        <button class="chip" aria-pressed="true" data-v="Tecnica/Logistica">Tecnica / Logistica</button>
      </div>
    </div>
  </div>
</details>

<p class="conteggio" id="conteggio"></p>
<ol id="lista"></ol>
<div id="vuoto"></div>
<p class="nota">__NOTA__ Inquadramento e area sono dedotti dal sommario: verifica sempre il testo del bando prima di candidarti.</p>

<script>
const BANDI = __DATI__;
const AGGIORNATO = "__AGGIORNATO__";
const REPO = "__REPO__";
const MAX = 310, CHIAVE = "radar-filtri";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const attivi = g => [...document.querySelectorAll(`[data-gruppo=${g}] .chip[aria-pressed=true]`)].map(c=>c.dataset.v);

function giorni(iso){
  if(!iso) return null;
  const s = new Date(iso+"T23:59:59"); return isNaN(s) ? null : Math.floor((s-new Date())/86400000);
}
function punteggio(b, raggio){
  const d = b.km ?? 150;
  const vic = raggio>=MAX ? 1-Math.min(d,600)/600 : Math.max(0,1-d/raggio);
  const tempo = b.gg==null ? .5 : Math.min(1, b.gg/30);
  return Math.round(55 + vic*25 + tempo*20);
}

function disegna(){
  const raggio = +$("#km").value, q = $("#q").value.trim().toLowerCase();
  $("#kmLabel").textContent = raggio>=MAX ? "Tutta Italia" : raggio+" km";
  const inq = attivi("inq"), area = attivi("area");
  $("#riassunto").textContent = `${raggio>=MAX?"Italia":raggio+" km"} · ${inq.length} inquadr. · ${area.length} aree`;

  const aperti = BANDI.map(b => ({...b, gg: giorni(b.s)})).filter(b => b.gg==null || b.gg>=0);
  const lista = aperti
    .filter(b => raggio>=MAX || (b.km!=null && b.km<=raggio))
    .filter(b => inq.includes(b.i) && area.includes(b.a))
    .filter(b => !q || `${b.e} ${b.t} ${b.c||""}`.toLowerCase().includes(q))
    .map(b => ({...b, p: punteggio(b, raggio)}))
    .sort((x,y) => y.p-x.p);

  $("#conteggio").innerHTML = `<strong>${lista.length} bandi</strong> su ${aperti.length} aperti in target, ordinati per affinità`;
  $("#lista").innerHTML = lista.map(b => {
    const cls = b.gg==null ? "ignota" : (b.gg<=7 ? "urgente" : "");
    const data = b.s ? new Date(b.s+"T12:00:00").toLocaleDateString("it-IT",{day:"numeric",month:"short"}) : "da verificare";
    return `<li class="bando ${cls}">
      <div class="scad"><b>${b.gg==null?"?":b.gg}</b><span>${b.gg==null?"scadenza":"giorni"}<br>${esc(data)}</span></div>
      <div class="corpo">
        <div class="ente"><span>${esc(b.e)}</span><span class="affinita">${b.p}%</span></div>
        <div class="titolo">${esc(b.t)}</div>
        <div class="meta">
          <span>${esc(b.c||"Sede n.d.")}${b.km!=null&&b.km>0?` · ${b.km} km`:""}</span>
          <span>${esc(b.i)}</span><span>${esc(String(b.a).replace("/"," / "))}</span>
          ${b.tipo && b.tipo!=="Concorso"?`<span>${esc(b.tipo)}</span>`:""}
          ${Number.isInteger(b.n)?`<span>${b.n} ${b.n>1?"posti":"posto"}</span>`:""}
        </div>
        <div class="link">
          <a href="${esc(b.u)}" target="_blank" rel="noopener">Testo in GU</a>
          <a href="https://portale.inpa.gov.it/ui/public/concorsi?keyword=${encodeURIComponent(b.cod)}" target="_blank" rel="noopener">Candidati su InPA</a>
        </div>
        <div class="gu">GU ${esc(b.gu)} · ${esc(b.cod)}</div>
      </div></li>`;
  }).join("");
  $("#vuoto").innerHTML = lista.length ? "" : `<div class="vuoto">Nessun bando con questi filtri. Allarga la distanza o riattiva un'area.</div>`;
}

function salva(){ try{ localStorage.setItem(CHIAVE, JSON.stringify({km:+$("#km").value, inq:attivi("inq"), area:attivi("area")})); }catch(e){} }
function carica(){
  try{
    const f = JSON.parse(localStorage.getItem(CHIAVE) || "null"); if(!f) return;
    $("#km").value = f.km ?? 60;
    document.querySelectorAll("[data-gruppo=inq] .chip").forEach(c=>c.setAttribute("aria-pressed",(f.inq||[]).includes(c.dataset.v)));
    document.querySelectorAll("[data-gruppo=area] .chip").forEach(c=>c.setAttribute("aria-pressed",(f.area||[]).includes(c.dataset.v)));
  }catch(e){}
}

const quando = new Date(AGGIORNATO);
$("#aggiornato").innerHTML = `Gazzetta Ufficiale · 4ª Serie<br>Aggiornato ${isNaN(quando) ? "" : quando.toLocaleDateString("it-IT",{day:"numeric",month:"long"})+" alle "+quando.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})}`;
if(REPO) $("#aggiorna").href = `https://github.com/${REPO}/actions/workflows/radar.yml`;
else $("#aggiorna").style.display = "none";

$("#km").addEventListener("input", disegna);
$("#km").addEventListener("change", salva);
$("#q").addEventListener("input", disegna);
document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
  c.setAttribute("aria-pressed", c.getAttribute("aria-pressed")!=="true"); disegna(); salva();
}));
carica(); disegna();
</script>
</body>
</html>
